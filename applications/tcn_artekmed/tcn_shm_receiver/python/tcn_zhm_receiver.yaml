application:
  title: TCN Artekmed Zenoh Receiver
  version: 1.0
  inputFormats: []
  outputFormats: ["screen"]

resources:
  cpu: 8
  gpu: 1
  memory: 1Gi
  gpuMemory: 1Gi

decoder:
  cuda_device_ordinal: 0
  verbose: false

holoviz:
  window_title: "TCN Artekmed Zenoh Receiver"
  width: 800
  height: 640
  framerate: 60

zenoh:
  topic_prefix: "tcn/loc/pcpd"
  capture_node: "k4a_capture_multi"
  zenoh_config_file: "/workspace/volumes/zenoh_config/zenoh_config.json5"
