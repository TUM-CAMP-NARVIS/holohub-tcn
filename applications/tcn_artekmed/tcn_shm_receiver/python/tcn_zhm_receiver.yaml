application:
  title: TCN Artekmed Shm Receiver
  version: 1.0
  inputFormats: []
  outputFormats: ["screen"]

debug_output:
  enable_colorimage: False
  enable_depthimage: False
  enable_pointcloud: True

resources:
  cpu: 24
  gpu: 1
  memory: 1Gi
  gpuMemory: 1Gi


depth_holoviz:
  window_title: "Artekmed Depthimages"
  width: 800
  height: 640
  framerate: 60

color_holoviz:
  window_title: "Artekmed Colorimages"
  width: 800
  height: 640
  framerate: 60

points_holoviz:
  window_title: "Artekmed Pointclouds"
  width: 800
  height: 640
  framerate: 60

shared_memory:
  stream_name: "camera_streams"
  cycle_time_ms: 1


rmm_allocator:

pose_tree_config:
  number_frames: 1024                # default: 1024
  number_edges: 16384                # default: 16384
  history_length: 1048576            # default: 1048576
  default_number_edges: 16           # default: 16
  default_history_length: 1024       # default: 1024
  edges_chunk_size: 4                # default: 4
  history_chunk_size: 64             # default: 64