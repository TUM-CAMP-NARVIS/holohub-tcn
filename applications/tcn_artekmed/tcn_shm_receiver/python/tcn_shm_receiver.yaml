application:
  title: TCN Artekmed Shm Receiver
  version: 1.0
  inputFormats: []
  outputFormats: ["screen"]

shared_memory:
  stream_name: "camera_streams"
  parameter_rpc_name: "tcn_shm_receiver"
  cycle_time_ms: 1

camera_stream_processing:
  device_id: 0
  buffer_size: 8
  enable_temporal_filter: true
  enable_background_substract: false
  enable_compute_weights: true

depthimage_temporal_filter:
  alpha: 0.15
  delta: 30
  persistence: 3

depthimage_fgbg_mask:
  sensitivity: 1.5

depthimage_apply_mask:
  invert_mask: False

depthimage_backprojection:
  depth_units_per_meter: 1000.0
  near_limit_m: 0.01
  far_limit_m: 10.0


depthimage_weights:
  depth_units_per_meter: 1000.0
  # 20 degree (PI / 9.0)
  angle_reject_limit: 0.3490658503988659
  angle_reject_envelope: 1.0
  offset_envelope: 1.0
  depth_near_limit: 0.1
  depth_far_limit: 8.0

rmm_allocator:

debug_output:
  enable_colorimage: True
  enable_depthimage: False
  enable_weights: False
  enable_pointcloud: True

resources:
  cpu: 24
  gpu: 1
  memory: 1Gi
  gpuMemory: 1Gi


depth_holoviz:
  window_title: "Artekmed Depthimages"
  width: 800
  height: 640
  framerate: 60

color_holoviz:
  window_title: "Artekmed Colorimages"
  width: 800
  height: 640
  framerate: 60

points_holoviz:
  window_title: "Artekmed Pointclouds"
  width: 800
  height: 640
  framerate: 60

weights_holoviz:
  window_title: "Artekmed Deptimage Weights"
  width: 800
  height: 640
  framerate: 60

pose_tree_config:
  number_frames: 1024                # default: 1024
  number_edges: 16384                # default: 16384
  history_length: 1048576            # default: 1048576
  default_number_edges: 16           # default: 16
  default_history_length: 1024       # default: 1024
  edges_chunk_size: 4                # default: 4
  history_chunk_size: 64             # default: 64