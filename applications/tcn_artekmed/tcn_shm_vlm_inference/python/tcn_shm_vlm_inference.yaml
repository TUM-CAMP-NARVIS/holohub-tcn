pose_tree_config:
  number_frames: 1024                # default: 1024
  number_edges: 16384                # default: 16384
  history_length: 1048576            # default: 1048576
  default_number_edges: 16           # default: 16
  default_history_length: 1024       # default: 1024
  edges_chunk_size: 4                # default: 4
  history_chunk_size: 64             # default: 64