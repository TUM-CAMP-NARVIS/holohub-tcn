application:
  title: TCN Artekmed Shm Receiver
  version: 1.0
  inputFormats: []
  outputFormats: ["screen"]

# ---------------------------------------------------------------------------
# Frame source -- "shm" (default) is the live pipeline, unchanged behaviour. "dataset" replays
# a fixed on-disk export through TcnDatasetReplayerOp instead of TcnShmSubscriberOp, for
# deterministic correctness gating: run twice with different settings, dump masks to two
# directories (mask_dump_dir below), then compare with docs/compare_mask_dumps.py. See
# docs/specs/2026-08-10-replay-harness-design.md §2.1/§2.2/§2.4.
# ---------------------------------------------------------------------------
source: "shm"

# Only read when source: "dataset". `frame_count` is REQUIRED, not just a preload cap: the app
# bounds the run with CountCondition(count=frame_count) so a harness run terminates on its own
# instead of running forever, and passes the SAME value straight through as the replayer's own
# `frame_count` -- so one run emits exactly this many frames, once, in "auto" playback.
dataset_source:
  # k4a_capture matches the live camera resolution (2048x1536); orbbec_capture (1920x1080)
  # does not but is fine for correctness A/B. See design doc "Dataset facts".
  path: "/workspace/volumes/artekmed_test_data/data/k4a_capture"
  cameras: ["camera01", "camera02", "camera03", "camera04"]
  frame_count: 6
  loop: false
  playback: "auto"

# Only read when this is non-empty. Writes one <mask_dump_dir>/frame<NNNNNN>_<camera>.npy per
# camera per tick from the langsam_multicam mask collector's output. Unset (default "") ->
# MaskDumpOp is not built at all, so a live run pays nothing. Requires
# camera_stream_processing.enable_langsam_multicam: true. See
# docs/compare_mask_dumps.py and design doc §2.2.
mask_dump_dir: ""
#mask_dump_dir: "/srv/tmp/harness/bd_on"

# ---------------------------------------------------------------------------
# Temporal synchronisation of the mask and depth streams
# (docs/specs/2026-08-11-temporal-sync-design.md). Requires
# camera_stream_processing.enable_langsam_multicam: true.
#
# The mask path runs ~5 fps and about two frames behind the source while depth is independent and
# faster, so pairing a mask with "whatever depth is current" mis-registers it by a varying amount.
# When enabled, only groups sharing one acquisition timestamp are emitted.
#
# Capacities are PER STREAM on purpose: each must exceed that stream's worst-case skew relative to
# the slowest stream, so the fast stream (depth) needs several times more slots than the slow one.
# Size depth_capacity from the real depth cadence once DA2/DA3 are enabled -- 16 is a placeholder.
#
# `match_policy: exact` is correct while every camera arrives through ONE shared-memory segment:
# the subscriber stamps one acquisition time per composite buffer and all cameras share it.
temporal_sync:
  enabled: false
  masks_capacity: 4
  depth_capacity: 16
  match_policy: "exact"     # exact | window
  window_ns: 0              # only used by 'window'
  verbose: false

# ---------------------------------------------------------------------------
# Mask/depth join (docs/specs/2026-08-12-mask-depth-join-design.md). Requires temporal_sync.enabled:
# joining a mask to an unsynchronised depth frame is exactly the mis-registration this path removes.
#
# Per camera: depth -> backprojection -> texcoords -> sample the panoptic map onto the depth grid ->
# apply_mask. Needs per-camera calibration; the dataset source loads it from the export's
# calibration/<camera>.json, the shm source from the device context.
mask_depth_join:
  enabled: false
  # Class ids (the high byte of the packed panoptic label) whose pixels the mask marks. Empty means
  # every non-background class. Ids follow the prompt order in langsam_multicam -- see class_id_map.
  select_classes: []
  # Depth pixels whose mask is 0 are zeroed. Set true to keep the background instead.
  invert_mask: false
  # Label written where a depth pixel has no colour correspondence (invalid depth, or projecting
  # outside the colour frustum). 0 is background, which is almost always what you want.
  unlabeled_value: 0

  # Classes the fused point-cloud view draws, one HolovizOp spec (hence one colour) each. Empty
  # derives them from text_prompts.prompts, which is what keeps them from drifting out of step with
  # what LangSAM actually detects: class ids are 1-based prompt positions.
  pointcloud_classes: []
  # Log per-class point counts every frame.
  verbose: false

# The fused labeled point cloud. Same viewer path as tcn_shm_receiver's point fusion (merge across
# cameras, flatten, POINTS_3D), one chain per class so classes are separable by colour.
labeled_pointcloud_holoviz:
  width: 1280
  height: 720
  window_title: "Labeled Point Cloud (fused)"
  headless: false

# Read by the per-camera backprojection ops in the join. depth_units_per_meter is a property of the
# capture format (Azure Kinect / Orbbec write millimetres) and a wrong value scales every unprojected
# point linearly; the limits reject depth samples outside them, whose texcoords then come back NaN.
depthimage_backprojection:
  depth_units_per_meter: 1000.0
  near_limit_m: 0.01
  far_limit_m: 10.0

shared_memory:
  stream_name: "camera_streams"
  parameter_rpc_name: "tcn_shm_receiver"
  cycle_time_ms: 1

camera_stream_processing:
  device_id: 0
  buffer_size: 8
  enable_da2: False
  enable_da3: False
  enable_langsam: False
  enable_langsam_multicam: True


# Depth Anything V2 Example
da2_inference_config:
  model_path: "/srv/models/active/depth_anything_v2/depth_anything_v2_vits.onnx"

da2_preprocessor:
  out_tensor_name: preprocessed
  out_dtype: "float32"
  resize_width: 518
  resize_height: 518
  scale_min: 0.0
  scale_max: 1.0

da2_inference:
  backend: "trt"
  pre_processor_map:
    "depth_v2": ["preprocessed"]
  inference_map:
    "depth_v2": ["inference_output"]
  input_on_cuda: true
  is_engine_path: false

# Depth Anything V3 Example
da3_inference_config:
  model_path: "/srv/models/active/depth_anything_v3/4010e39f3634a45bc60553321fb49fb760bd594e.onnx"
  # Metric depth display range in meters (colorized: near -> red, far -> blue)
  depth_near: 0.3
  depth_far: 10.0

da3_preprocessor:
  out_tensor_name: preprocessed
  out_dtype: "float32"
  resize_width: 518
  resize_height: 518
  scale_min: 0.0
  scale_max: 1.0

da3_inference:
  backend: "trt"
  pre_processor_map:
    "depth_v3": ["preprocessed"]
  inference_map:
    "depth_v3": ["inference_output"]
  input_on_cuda: true
  is_engine_path: false

# ---------------------------------------------------------------------------
# GPU topology -- the single source of truth for which cameras run on which GPU.
# Read by the application AND by the offline engine builders
# (docs/gdino_trt_export.py / docs/sam_trt_export.py, --from-config), so the engines that
# exist always match the split that runs.
#
# A worker's ENGINE BATCH is its camera count -- derived, never configured. GPU 0 gets the
# smaller share because it also drives Holoviz, the collector and colorize.
# Changing a split means rebuilding that batch; the app fails fast at startup with the command.
#
# Both camera counts below are real, supported deployment topologies (4-camera and 5-camera
# rigs both run in production) -- not "production" vs "test". Pick the `workers:` block
# matching the rig actually connected (or, in source: "dataset" mode, the export being
# replayed) and comment out the other. Each profile needs its OWN engines, built for its own
# batch sizes:
#   5-camera rig (2/3 split): batch-2 AND batch-3 engines
#   4-camera rig (2/2 split): batch-2 engines only
# The app validates gpu_workers.workers against the active source's cameras at startup and
# fails fast, naming exactly which cameras are missing/extra, if they don't match.
# ---------------------------------------------------------------------------
gpu_workers:
  # Run each worker's gdino/sam/panoptic as three chained operators instead of one, so stages
  # overlap across frames (period tends toward max(stage) rather than sum(stage)). Costs ~2 ticks
  # of extra mask latency. false -> the original single LangSamBatchOp per worker.
  # See docs/specs/2026-08-07-langsam-pipelining-design.md.
  pipelined: false

  # -- 5-camera profile (needs batch-2 + batch-3 engines) --
  workers:
    - device: 0
      cameras: ["camera01_colorimage", "camera02_colorimage"]
    - device: 1
      cameras: ["camera03_colorimage", "camera04_colorimage", "camera05_colorimage"]
#      cameras: ["camera03_colorimage", "camera04_colorimage"]

  # -- 4-camera profile (needs batch-2 engines only) --
  # workers:
  #   - device: 0
  #     cameras: ["camera01_colorimage", "camera02_colorimage"]
  #   - device: 1
  #     cameras: ["camera03_colorimage", "camera04_colorimage"]

# LangSAM (Grounding DINO + SAM2) Configuration
langsam_inference:
  # A/B: sam2.1_hiera_tiny (faster encoder) vs sam2.1_hiera_small (higher quality).
  sam_type: "sam2.1_hiera_tiny"
  sam_ckpt_path: null
  gdino_model_ckpt_path: null  # Set to null to download from HuggingFace, or provide local path
  gdino_processor_ckpt_path: null  # Set to null to download from HuggingFace, or provide local path
  # Grounding DINO variant (used when the local paths above are null). "-tiny" (Swin-T) is
  # a smaller backbone than "-base" (Swin-B); switch back to base if detection quality suffers.
  gdino_model_id: "IDEA-Research/grounding-dino-tiny"
  # Detector resize target (shortest edge, px). HF default is 800, which UPSCALES a typical
  # camera frame -- the main GDINO cost is here, not the backbone. Lower = faster; raise
  # toward 640/800 if small objects are missed. null = keep the HF default (800).
  gdino_input_size: 512
  # Run Grounding DINO fully on GPU (no PIL / CPU image processor / host<->device copies,
  # cached text tokenization). Set false to fall back to the original PIL path.
  gdino_gpu_preprocess: true
  # Keep SAM masks on the GPU (avoids SAM2's full-res float mask device->host->device
  # roundtrip). Set false to use the stock numpy predict_batch path.
  sam_gpu_output: true
  # SAM 2 image encoder backend: "pytorch" (eager) | "trt" (prebuilt engine from
  # docs/sam_trt_export.py). The _b<N>_ in the engine name is its FIXED batch, baked at ONNX
  # trace time; N must be >= every worker's camera count and smaller workers pad up to it.
  sam_backend: "trt"
  sam_trt_engine: "/srv/models/active/sam2/sam2.1_hiera_tiny_encoder_b{batch}_fp16.engine"
  # Panoptic-map paint backend: "cupy" (existing per-detection boolean-mask assignment) |
  # "cuda" (fused kernel, one launch per camera -- see
  # docs/specs/2026-08-10-panoptic-cuda-design.md). cupy's nonzero()-based scatter forces a
  # device sync PER DETECTION (~45 syncs/tick measured, 28.5 ms wall for ~3 ms of real GPU
  # work); "cuda" removes that. Falls back to "cupy" with a loud WARNING if the compiled
  # extension (operators/tcn_artekmed/tcn_panoptic_map) is missing.
  panoptic_backend: "cuda"
  # Decode all of a worker's cameras' boxes in ONE SAM mask-decoder call instead of looping
  # per camera (see docs/specs/2026-08-10-sam-batched-decode-design.md). Output is
  # near-identical to the loop, NOT bitwise-identical (batching reassociates floating-point
  # reductions). Falls back to the loop if a worker's cameras do not all share one resolution.
  sam_batched_decode: true
  # torch.compile the GDINO model / SAM2 image encoder (no quality loss). WARNING: first-
  # forward compilation is heavy on host RAM and can OOM (SIGKILL/-9), especially GDINO.
  # Enable ONE at a time and watch memory; sam_compile is the safer/cleaner target.
  gdino_compile: false
  # sam_compile MUST stay false while `gpu_workers.workers` has more than one worker.
  # Dynamo's tracer and the autocast cache are PROCESS-global: one worker tracing the SAM
  # encoder while another leaves the global torch.autocast context can deadlock both
  # permanently (hard hang, only SIGKILL recovers).
  #
  # MEASURED 2026-08-05 (sam_compile: true, 2 workers, batch-3 GDINO engine, 586 s run):
  #  - The compiles are a STARTUP cost, NOT recurring mid-run re-traces as previously assumed:
  #    4 stalls totalling 284 s, all inside the first 146 s (two graphs per worker, longest
  #    single call 78 s), then none for the remaining ~440 s.
  #  - Both workers compiled CONCURRENTLY (t=+0.3 s on both) -- exactly the deadlock condition.
  #    That run survived it. That is luck, not a guarantee, and the window reopens every start.
  #  - Steady-state gain is only +4.5% (period 194.5 -> 186.2 ms, 5.14 -> 5.37 fps): compile
  #    speeds up the SAM ENCODER, but the per-image decode loop -- about half the sam stage --
  #    is untouched. Effective throughput over the run was 3.96 fps, a 23% REGRESSION, because
  #    of the startup stalls; break-even is around a one-hour run.
  # Making it safe would need a CONSTANT SAM batch (one graph only) plus warmup in __init__,
  # where operator construction is sequential and so closes the concurrency window. Not worth
  # it for +4.5%: the SAM encoder is moving to TensorRT instead, which removes Dynamo entirely.
  sam_compile: false
  box_threshold: 0.3
  text_threshold: 0.25
  # Grounding DINO backend: "pytorch" (current) | "trt" (prebuilt TensorRT engine).
  # "trt" requires an engine + text tensors built offline by docs/gdino_trt_export.py; keep
  # "pytorch" until those artifacts exist. gdino_trt_hw must match the engine's build size.
  #
  # The _b<N>_ in the engine name is its FIXED batch, baked at ONNX trace time (a Where in the
  # encoder fusion attention is only broadcast-conformable at the traced batch). N must be >=
  # every worker's camera count in gpu_workers above; smaller workers pad up to it and
  # discard the extra slices. Changing a worker's camera count above N needs a re-export AND a
  # rebuild, both at --batch <new N> -- the runtime fails fast at startup with the command.
#  gdino_backend: "pytorch"
  gdino_backend: "trt"
  gdino_trt_engine: "/srv/models/active/groundingdino/gdino_swint_512x672_b{batch}_tf32.engine"
  gdino_trt_text: "/srv/models/active/groundingdino/gdino_swint_prompts.npz"
  gdino_trt_hw: [512, 672]
  # Set true to log rolling GDINO-vs-SAM per-stage timing (to find the bottleneck).
  timing: false
  timing_log_every: 30

text_prompts:
#  prompts: ["floor", "person", "robot", "furniture", "lamp"]
#  prompts: ["floor", "person"]
  prompts: ["person", "bed", "device", "hololens", "pipes"]

langsam_postprocessor:
  save_intermediate: false
  verbose: false

langsam_multicam_holoviz:
  width: 1920
  height: 1080
  framerate: 30

debug_output:
  enable_colorimage: True
  enable_depthimage: False
  enable_weights: False
  enable_pointcloud: True
  enable_warped_color: True

resources:
  cpu: 24
  gpu: 1
  memory: 1Gi
  gpuMemory: 1Gi

holoviz:
  width: 518
  height: 518

da2_holoviz:
  width: 518
  height: 518

da3_holoviz:
  width: 518
  height: 518

langsam_holoviz:
  width: 1024
  height: 1024
  framerate: 30

depth_holoviz:
  window_title: "Artekmed Depthimages"
  width: 800
  height: 640
  framerate: 60

color_holoviz:
  window_title: "Artekmed Colorimages"
  width: 800
  height: 640
  framerate: 60

points_holoviz:
  window_title: "Artekmed Pointclouds"
  width: 800
  height: 640
