%YAML 1.2
---
application:
  title: TCN Artekmed Zenoh Receiver (C++)
  version: 1.0
  inputFormats: []
  outputFormats: []

resources:
  cpu: 8
  gpu: 1
  memory: 1Gi
  gpuMemory: 1Gi

zenoh:
  topic_prefix: "tcn/inm-mobile/pcpd"
  capture_node: "orbbec_capture_multi"
  zenoh_config_file: "/workspace/volumes/zenoh_config/zenoh_config.json5"
  stream_types:
    - "color"
    - "depth"

pipeline:
  device_id: 0

# GXF H264/H265 decoder configuration (used for compressed streams)
video_decoder_request:
  inbuf_storage_type: 0  # 0: kHost (receiver emits host tensors for compressed)

video_decoder_response:
  outbuf_storage_type: 1  # 1: kDevice (decoded frames on GPU)
